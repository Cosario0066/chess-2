<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess 2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #171717;
            color: white;
            font-family: Arial, sans-serif;
        }
        .panel {
            background: #222;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        h1 {
            text-align: center;
            margin-top: 0;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(10, 52px);
            grid-template-rows: repeat(10, 52px);
            border: 4px solid #7d5b2d;
            background: #d9b67b;
        }
        .cell {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0,0,0,0.08);
            box-sizing: border-box;
            cursor: pointer;
            position: relative;
        }
        .light { background: #f2d9a2; }
        .dark { background: #b78a4a; }
        .cell.selected {
            box-shadow: inset 0 0 0 4px #f7d354;
        }
        .cell.possible-move::after {
            content: "";
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(35, 115, 55, 0.75);
            position: absolute;
        }
        .cell.possible-capture {
            box-shadow: inset 0 0 0 4px rgba(180, 45, 35, 0.85);
        }
        .piece {
            font-size: 38px;
            line-height: 1;
            pointer-events: none;
        }
        .piece.black { color: #111; }
        .piece.white { color: #fafafa; text-shadow: 0 0 2px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
<div class="panel">
    <div id="board" class="board"></div>
</div>

<script src="/board.js"></script>
</body>
</html>

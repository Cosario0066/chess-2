<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess 2</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #171717;
            color: white;
            font-family: Arial, sans-serif;
        }
        .panel {
            background: #222;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        h1 {
            text-align: center;
            margin-top: 0;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(10, 52px);
            grid-template-rows: repeat(10, 52px);
            border: 4px solid #7d5b2d;
            background: #d9b67b;
        }
        .cell {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            border: 1px solid rgba(0,0,0,0.08);
        }
        .light { background: #f2d9a2; }
        .dark { background: #b78a4a; }
        .piece.black { color: #111; }
        .piece.white { color: #fafafa; text-shadow: 0 0 2px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
<div class="panel">
    <h1>Plateau 10x10</h1>
    <div id="board" class="board"></div>
</div>

<script>
    async function loadBoard() {
        const boardEl = document.getElementById('board');
        try {
            const response = await fetch('/api/board');
            const data = await response.json();
            boardEl.innerHTML = '';

            data.board.forEach((row, y) => {
                row.forEach((cell, x) => {
                    const div = document.createElement('div');
                    const isLight = (x + y) % 2 === 0;
                    div.className = 'cell ' + (isLight ? 'light' : 'dark');

                    if (cell && cell.trim() !== '') {
                        const blackPieces = ['♜','♞','♝','♛','♚','♟'];
                        const pieceClass = blackPieces.includes(cell) ? 'piece black' : 'piece white';
                        div.innerHTML = '<span class="' + pieceClass + '">' + cell + '</span>';
                    }

                    boardEl.appendChild(div);
                });
            });
        } catch (error) {
            boardEl.innerHTML = '<div style="padding:20px;color:red;">Erreur de chargement du plateau</div>';
            console.error(error);
        }
    }

    loadBoard();
</script>
</body>
</html>
